ServerName localhost

# The checkout is the document root, so keep local tooling and secrets private.
<LocationMatch "^/(?:\.|dev(?:/|$)|scripts(?:/|$)|compose\.ya?ml$|README\.md$)">
    Require all denied
</LocationMatch>

<FilesMatch "(?i)(?:^\.|\.(?:sql|log|bak|ini|sh)$)">
    Require all denied
</FilesMatch>

name: letco-rebuild

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Run bash scripts/local.sh start first}
  WORDPRESS_AUTH_SECRET: ${WORDPRESS_AUTH_SECRET:?Run bash scripts/local.sh start first}
  WP_HOME: http://localhost:${WP_PORT:-8081}

x-wordpress-volumes: &wordpress-volumes
  - type: bind
    source: .
    target: /var/www/html
  - type: bind
    source: ./dev/wp-config.php
    target: /var/www/html/wp-config.php
    read_only: true

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Run bash scripts/local.sh start first}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:7.1.3-php8.5-apache
    # Run the checked-out WordPress core. Skip image copying and recursive chown,
    # which are unnecessary here and problematic on shared Windows/NTFS disks.
    entrypoint: [apache2-foreground]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *wordpress-environment
      APACHE_RUN_USER: "#${LOCAL_UID:-1000}"
      APACHE_RUN_GROUP: "#${LOCAL_GID:-1000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8081}:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: bind
        source: ./dev/wp-config.php
        target: /var/www/html/wp-config.php
        read_only: true
      - ./dev/apache-local.conf:/etc/apache2/conf-enabled/local.conf:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost/wp-login.php]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cli:
    image: wordpress:cli-php8.5
    profiles: [tools]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *wordpress-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress-volumes
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
